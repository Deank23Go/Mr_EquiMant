/*
 * Build configurado para:
 * - Spring Boot 3.3 + Java 21
 * - Lombok + JPA + PostgreSQL + Flyway
 * - Swagger (SpringDoc)
 * - SonarCloud + Jacoco (cobertura)
 */

plugins {
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id "org.sonarqube" version "6.3.1.5724"
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Swagger (SpringDoc OpenAPI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Flyway (¡ES NECESARIO PARA TU PROYECTO!)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-core:10.15.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Java 21
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Jacoco para cobertura
apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.11"
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// SonarQube
sonar {
    properties {
        property "sonar.projectKey", "Deank23Go_Mr_EquiMant"
        property "sonar.organization", "deank23go"
        property "sonar.host.url", "https://sonarcloud.io" // ← ESPACIOS ELIMINADOS
        property "sonar.java.source", "21"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.token", System.getenv("SONAR_TOKEN") // ← ¡Perfecto para CI/CD!
    }
}